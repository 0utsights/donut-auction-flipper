services:
  auction-server:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    network_mode: host
    dns:
      - ${SECOND_PC_RUNTIME_DNS:-9.9.9.9}
    environment:
      DN_ADDRESS: 127.0.0.1:8080
      DN_FAST_INTERVAL: ${SECOND_PC_FAST_INTERVAL:-500ms}
      DONUT_API_KEY: ${DONUT_API_KEY:?set DONUT_API_KEY in the second-PC .env file}
      DN_CLIENT_TOKEN: ""
      DN_OBSERVER_TOKEN: ""
      DN_FABRIC_TOKEN: ""
    volumes:
      - ./data:/data
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  order-collector:
    build:
      context: ./collector
      dockerfile: Dockerfile.prebuilt
    network_mode: host
    dns:
      - ${SECOND_PC_RUNTIME_DNS:-9.9.9.9}
    depends_on:
      auction-server:
        condition: service_healthy
    volumes:
      - ./collector/accounts.json:/run/secrets/collector-accounts.json:ro
      - ./collector/order-schemas.json:/app/order-schemas.json:ro
      - ./collector/profiles:/data/profiles
      - ./collector/captures:/app/captures
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
